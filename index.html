<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAMO - Everyone, Connected</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f5fc;
      color: #24213a;
    }
    header {
      background: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px #0000000c;
    }
    .logo {
      font-size: 30px;
      font-weight: bold;
      color: #7952dc;
    }
    .hero {
      text-align: center;
      padding: 65px 20px 35px;
    }
    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }
    .hero span { color: #7952dc; }
    .hero p { color: #777; font-size: 18px; }
    .feed {
      max-width: 650px;
      margin: 20px auto;
      padding: 15px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px #00000008;
    }
    .post-image {
      background: linear-gradient(135deg,#d8c8ff,#b9d7ff);
      height: 210px;
      border-radius: 14px;
      margin: 15px 0;
      display: grid;
      place-items: center;
      color: #5637a7;
      font-size: 24px;
      font-weight: bold;
    }
    button {
      border: 0;
      background: #7952dc;
      color: white;
      padding: 12px 22px;
      border-radius: 25px;
      cursor: pointer;
    }
    footer {
      text-align: center;
      padding: 25px;
      color: #888;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">TAMO</div>
    <button>تسجيل الدخول</button>
  </header>

  <section class="hero">
    <h1>أهلاً بك في <span>TAMO</span></h1>
    <p>عالم واحد.. الجميع متصلون.</p>
    <button>انضم إلى مجتمعنا</button>
  </section>

  <main class="feed">
    <div class="card">
      <h3>🌟 اكتشف عالم TAMO</h3>
      <p>شارك لحظاتك وأفكارك مع العالم.</p>
      <div class="post-image">Everyone, Connected.</div>
      <button onclick="this.innerText='❤️ أعجبني'">🤍 إعجاب</button>
    </div>

    <div class="card">
      <h3>🚀 قصص ومقاطع ومنشورات</h3>
      <p>كل ما تحبه في منصة اجتماعية واحدة.</p>
    </div>
  </main>

  <footer>© 2026 TAMO — Everyone, Connected.</footer>
</body>
</html>
